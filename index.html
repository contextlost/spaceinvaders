<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Space Invaders</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="800" height="600" aria-label="Space Invaders playable area" tabindex="0"></canvas>

    <div class="hud" id="hud">
      <div class="hudItem"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="hudItem"><div class="label">LIVES</div><div class="value" id="lives">♥♥♥</div></div>
      <div class="hudItem"><div class="label">LEVEL</div><div class="value" id="level">1</div></div>
      <div class="hudItem"><div class="label">HI‑SCORE</div><div class="value" id="hiscore">0</div></div>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>

    <div class="overlay" id="overlay">
      <div class="card menu">
        <h1>Space Invaders</h1>
        <p>← / → move · Space shoot · <span class="kbd">1</span> center fire · <span class="kbd">2</span> dual fire</p>
        <p class="control-line"><span class="kbd">P</span> pause · <span class="kbd">R</span> restart · <span class="kbd">M</span> mute · <span class="kbd">Esc</span> menu</p>
        <p><strong>Press <span class="kbd">Enter</span> to start</strong></p>
      </div>
    </div>

    <div class="overlay hidden" id="transmission-overlay">
      <div class="card transmission">
        <h1 id="transmission-title">Intercepted Transmission!</h1>
        <p id="transmission-text">Initializing message...</p>
        <button id="close-transmission-btn">Continue</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
